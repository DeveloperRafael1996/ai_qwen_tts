[project]
name = "qwen-tts-playground"
version = "0.1.0"
description = "Local multilingual TTS playground for Qwen3-TTS-12Hz-1.7B-VoiceDesign."
readme = "README.md"
authors = [
    { name = "Rafael Guevara Aller", email = "djzm80@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.17.3",
    "huggingface-hub>=0.36.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qwen-tts>=0.1.1",
    "soundfile>=0.14.0",
]

[project.scripts]
qwen-tts-playground = "qwen_tts_playground:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "SIM",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
